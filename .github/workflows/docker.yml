name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger, for validating Docker Hub / ghcr wiring without cutting
  # a release. Builds from any version already live on PyPI and pushes under
  # a throwaway tag by default, so a botched test never lands on :latest or
  # overwrites a real version tag.
  workflow_dispatch:
    inputs:
      version:
        description: "net-benchmark version already published on PyPI (e.g. 0.5.4)"
        required: true
        type: string
      tag_suffix:
        description: "Tag to push under. Leave as 'test' unless you mean to publish."
        required: true
        default: "test"
        type: string
      push:
        description: "Actually push to registries (uncheck to build-only)"
        required: true
        default: false
        type: boolean

env:
  DOCKERHUB_IMAGE: joeovo/net-benchmark
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  wait-for-pypi:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # pypi.yml fires off this same tag independently, no ordering
      # guarantee between them. Image installs from PyPI, so it has to
      # wait for the real thing rather than race it.
      - name: Wait for the version to actually be installable from PyPI
        run: |
          V="${{ steps.version.outputs.version }}"
          python3 -m venv /tmp/pypi-check
          for i in $(seq 1 30); do
            if /tmp/pypi-check/bin/pip download --no-deps --dest /tmp/pypi-check-dl \
                "net-benchmark==${V}" >/dev/null 2>&1; then
              echo "net-benchmark==${V} is installable from PyPI"
              exit 0
            fi
            echo "not yet installable (attempt $i/30) — PyPI's JSON API can go green before its package index catches up, so this checks the real thing pip install will do..."
            sleep 20
          done
          echo "::error::net-benchmark==${V} was still not installable after 10 minutes"
          exit 1

  build-amd64:
    needs: wait-for-pypi
    runs-on: ubuntu-latest
    # packages: write required for ghcr.io — GITHUB_TOKEN defaults to
    # read-only, silently breaks ghcr push while Docker Hub (PAT auth)
    # still works.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # a failure in one target (e.g. -pdf) must not cancel the other before it finishes
      matrix:
        target: [final-lean, final-pdf]
    outputs:
      lean_digest: ${{ steps.digest.outputs.lean_digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag suffix
        id: tag
        run: |
          if [ "${{ matrix.target }}" = "final-pdf" ]; then
            echo "suffix=-pdf" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          build-args: |
            NET_BENCHMARK_VERSION=${{ needs.wait-for-pypi.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.wait-for-pypi.outputs.version }}${{ steps.tag.outputs.suffix }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.tag_suffix) || '' }}-amd64
            ${{ env.GHCR_IMAGE }}:${{ needs.wait-for-pypi.outputs.version }}${{ steps.tag.outputs.suffix }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.tag_suffix) || '' }}-amd64

  build-arm64:
    needs: wait-for-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true  # a wheel gap or emulation flake on this arch
                              # must never block amd64 from shipping
    strategy:
      fail-fast: false  # a failure in one target (e.g. -pdf) must not cancel the other before it finishes
      matrix:
        target: [final-lean, final-pdf]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag suffix
        id: tag
        run: |
          if [ "${{ matrix.target }}" = "final-pdf" ]; then
            echo "suffix=-pdf" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          build-args: |
            NET_BENCHMARK_VERSION=${{ needs.wait-for-pypi.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.wait-for-pypi.outputs.version }}${{ steps.tag.outputs.suffix }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.tag_suffix) || '' }}-arm64
            ${{ env.GHCR_IMAGE }}:${{ needs.wait-for-pypi.outputs.version }}${{ steps.tag.outputs.suffix }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.tag_suffix) || '' }}-arm64

  publish-manifest:
    needs: [wait-for-pypi, build-amd64, build-arm64]
    if: always() && needs.build-amd64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        registry_image: ["joeovo/net-benchmark", "ghcr.io/net-benchmark/net-benchmark"]
        variant: [{ suffix: "", target: "final-lean" }, { suffix: "-pdf", target: "final-pdf" }]
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: startsWith(matrix.registry_image, 'joeovo/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io
        if: startsWith(matrix.registry_image, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gates on NEW fixable critical/high CVEs vs current :latest, not
      # total count — -pdf has a known unfixed debian/tiff critical that
      # would otherwise block every build. Docker Hub only; scout is a
      # Docker Hub product. Untested — confirm via workflow_dispatch
      # before trusting this on a real release.
      - name: Docker Scout — block on new fixable critical/high CVEs
        if: startsWith(matrix.registry_image, 'joeovo/')
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ matrix.registry_image }}:${{ needs.wait-for-pypi.outputs.version }}${{ matrix.variant.suffix }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.tag_suffix) || '' }}-amd64
          to: ${{ matrix.registry_image }}:latest${{ matrix.variant.suffix }}
          ignore-unchanged: true
          only-severities: critical,high
          only-fixed: true
          exit-on: vulnerability

      - name: Assemble manifest (amd64 + arm64 if it landed, amd64 alone otherwise)
        if: github.event_name != 'workflow_dispatch'  # never touch :latest or the version tag from a test run
        env:
          V: ${{ needs.wait-for-pypi.outputs.version }}
          SUFFIX: ${{ matrix.variant.suffix }}
          IMG: ${{ matrix.registry_image }}
          ARM_OK: ${{ needs.build-arm64.result == 'success' }}
        run: |
          SOURCES="${IMG}:${V}${SUFFIX}-amd64"
          if [ "$ARM_OK" = "true" ]; then
            SOURCES="$SOURCES ${IMG}:${V}${SUFFIX}-arm64"
          else
            echo "::warning::arm64 build did not succeed — publishing amd64-only manifest for ${IMG}:${V}${SUFFIX}"
          fi
          docker buildx imagetools create \
            --tag "${IMG}:${V}${SUFFIX}" \
            --tag "${IMG}:latest${SUFFIX}" \
            --tag "${IMG}:${GITHUB_SHA::12}${SUFFIX}" \
            $SOURCES

      # Per-arch tags (-amd64/-arm64) exist only so this job can assemble
      # them into the manifest above — the manifest references the images
      # by digest, not by tag, so deleting the tag afterward doesn't touch
      # what actually got published. continue-on-error because a cleanup
      # failure must never be allowed to affect whether the release itself
      # succeeded — worst case, an extra tag sits there until next time.
      - name: Clean up per-arch source tags (Docker Hub)
        if: github.event_name != 'workflow_dispatch' && startsWith(matrix.registry_image, 'joeovo/')
        continue-on-error: true
        env:
          V: ${{ needs.wait-for-pypi.outputs.version }}
          SUFFIX: ${{ matrix.variant.suffix }}
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          for arch in amd64 arm64; do
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/joeovo/net-benchmark/tags/${V}${SUFFIX}-${arch}/"
          done

      # NOT verified — GITHUB_TOKEN + packages:write is confirmed to push
      # to ghcr.io, but package *version deletion* is a different
      # permission and hasn't been tested. continue-on-error means a
      # failure here is silent (check the Actions log, not tag list, to
      # know if it's actually working) — confirm via a real run before
      # assuming ghcr cleanup is happening at all.
      - name: Clean up per-arch source tags (GHCR)
        if: github.event_name != 'workflow_dispatch' && startsWith(matrix.registry_image, 'ghcr.io/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.wait-for-pypi.outputs.version }}
          SUFFIX: ${{ matrix.variant.suffix }}
        run: |
          for arch in amd64 arm64; do
            TAG="${V}${SUFFIX}-${arch}"
            VERSION_ID=$(gh api "/orgs/net-benchmark/packages/container/net-benchmark/versions" --paginate \
              --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" | head -1)
            if [ -n "$VERSION_ID" ]; then
              gh api --method DELETE "/orgs/net-benchmark/packages/container/net-benchmark/versions/${VERSION_ID}"
            fi
          done
